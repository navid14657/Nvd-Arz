<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوت به مراسم ازدواج نوید و آرزو</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loader">

<div class="loader-heart">💗</div>

<p>در حال آماده‌سازی دعوتنامه...</p>

</div>

<div class="overlay"></div>

<div class="container">

<img src="images/invitation.jpg" class="invitation" alt="دعوتنامه">

<div class="glass">

<h3>⏳ تا شروع مراسم</h3>

<div id="countdown" class="countdown">

<div class="time-box">

<span id="days">0</span>

<label>روز</label>

</div>

<div class="time-box">

<span id="hours">0</span>

<label>ساعت</label>

</div>

<div class="time-box">

<span id="minutes">0</span>

<label>دقیقه</label>

</div>

<div class="time-box">

<span id="seconds">0</span>

<label>ثانیه</label>

</div>

</div>

</div>

<div class="glass">

<h3>🗓 زمان مراسم</h3>

<p>

سه‌شنبه

<br>

۲۴ شهریور ۱۴۰۵

<br>

ساعت ۱۸:۳۰

</p>

</div>

<div class="glass">

<h3>📍 مکان برگزاری</h3>

<p>

مشهد

<br>

باغ سرای براید گاردن (عروس)

</p>

</div>

<div class="buttons">

<button onclick="openMap()">

🗺️ مسیریابی آنلاین

</button>

<button onclick="toggleMusic()">

🎵 پخش / توقف موسیقی

</button>

</div>

<audio id="music" autoplay loop playsinline>

<source src="music.mp3" type="audio/mpeg">

</audio>

<footer>

با عشق ❤️

<br>

آرزو و نوید

</footer>

</div>

<script src="script.js"></script>

</body>

</html>
